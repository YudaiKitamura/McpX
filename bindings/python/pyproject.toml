[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcpx"
version = "0.12.0"
description = "MC protocol communication library for Mitsubishi PLCs (Python bindings for McpX)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Yudai Kitamura" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]

[project.urls]
Homepage = "https://mcpx.yktmr.jp/"
Repository = "https://github.com/YudaiKitamura/McpX"

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mcpx = ["_native/*.dll", "_native/*.so", "_native/*.dylib", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["real_plc: tests against a real PLC (MCPX_REAL_PLC=1)"]
