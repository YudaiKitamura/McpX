name: .NET CI

on:
  push:
    branches:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Restoring dependencies
        run: dotnet restore

      - name: Build Test project
        run: dotnet build --configuration Release --no-restore
        working-directory: TestMcpX

      - name: Run Test
        run: dotnet test --configuration Release --no-build --logger trx
        working-directory: TestMcpX

      - name: Run Interop Test
        run: dotnet test --configuration Release --logger trx
        working-directory: TestMcpXInterop

  # ネイティブライブラリ（C ABI）を各 OS・CPU で Native AOT ビルドし、C のヘッダ検査とスモークテストを行う
  aot-publish:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            lib: mcpx.dll
          - os: ubuntu-22.04
            rid: linux-x64
            lib: mcpx.so
          - os: ubuntu-22.04-arm
            rid: linux-arm64
            lib: mcpx.so
          - os: macos-14
            rid: osx-arm64
            lib: mcpx.dylib
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '9.0.x'

      - name: Publish AOT
        run: dotnet publish McpXInterop/McpXInterop.csproj -c Release -r ${{ matrix.rid }} /p:PublishAot=true

      - name: Check C header
        run: |
          clang -std=c11 -Wall -Wextra -Werror -IMcpXInterop/include tests/c/header_check.c -o header_check
          ./header_check

      # スモークテストは dlopen を使うため Linux / macOS のみ
      - name: Smoke test
        if: runner.os != 'Windows'
        run: |
          clang -std=c11 -Wall -Wextra -Werror -IMcpXInterop/include tests/c/smoke.c -o smoke -ldl
          ./smoke McpXInterop/bin/Release/net9.0/${{ matrix.rid }}/publish/${{ matrix.lib }}

      - name: Upload native library
        uses: actions/upload-artifact@v4
        with:
          name: mcpx-${{ matrix.rid }}
          path: |
            McpXInterop/bin/Release/net9.0/${{ matrix.rid }}/publish/${{ matrix.lib }}
            McpXInterop/include/mcpx.h
